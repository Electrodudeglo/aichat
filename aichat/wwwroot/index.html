<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Mo's Chat</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="icon" type="image/png" href="favicon-32.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-screen" role="status" aria-live="polite">
            <div class="loading-ring">
                <svg aria-hidden="true">
                    <circle r="40%" cx="50%" cy="50%" />
                    <circle r="40%" cx="50%" cy="50%" />
                </svg>
                <div class="loading-percent"></div>
            </div>
            <h1 class="loading-title">Mo's Chat</h1>
            <p class="loading-caption">Loading your workspace...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        <strong>Something went wrong</strong>
        An unhandled error has occurred. Reloading the page usually fixes it.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" role="button" aria-label="Dismiss">&#x2715;</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
